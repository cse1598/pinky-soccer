amcl:
  ros__parameters:
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    map_topic: /map
    tf_broadcast: true
    transform_tolerance: 0.3
    robot_model_type: nav2_amcl::DifferentialMotionModel
    set_initial_pose: true
    initial_pose.z: 0.0
    min_particles: 500
    max_particles: 1500
    max_beams: 100
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 0.25
    sigma_hit: 0.03
    z_hit: 0.9
    z_rand: 0.1
    laser_min_range: 0.05
    laser_max_range: 12.0
    update_min_d: 0.01
    update_min_a: 0.02
    resample_interval: 1
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    # Starting assumptions; measure/tune on the real field, not calibration results.
