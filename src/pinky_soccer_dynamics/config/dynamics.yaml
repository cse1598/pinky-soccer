# Pinky Pro wheel-level dynamics: default parameters per target.
#
# Two parameter groups are kept apart on purpose:
#   model:   how the robot actually moves for given wheel speeds (effective radii, track,
#            wheel response). Replaced by measured values from calibration.
#   driver:  what the velocity driver does with /cmd_vel (its own radius/separation and
#            limits). Only used by the command adapter to turn wheel-speed targets back into
#            /cmd_vel, so that a calibration value is never applied twice.
#
# Every value carries a `source`:
#   official_default      value in the unmodified official package (not measured)
#   simulation_model      value of the simulator model (true for that simulator only)
#   assumption            placeholder chosen by us; must be identified
#   measured              written only by the calibration loaders (never by hand here)
# Units: m, rad, s.
schema_version: 1

# Command limits for controllers (NMPC). The same XL330 wheel motor in every target, so the
# limits are shared; the simulators emulate the real driver (pinky_soccer_sim).
#   wheel speed command max = usage_ratio * motor_rated_rpm   (capped by model.wheel_speed_max)
#   wheel accel command max = usage_ratio * motor_accel       (capped by model.wheel_accel_max)
limits:
  motor_rated_rpm: {value: 103.0, source: manual,
                    ref: "ROBOTIS e-Manual XL330-M288-T no-load speed 103 rev/min at 5.0 V. Model listed on PinkLAB official Pinky Pro product page https://pinklab.art/pinky-pro/; actual supply voltage and hardware registers not read from the robot"}
  motor_accel:     {value: 74.9, source: official_default,
                    ref: "the manual gives no physical acceleration limit; the motor ramps at the official driver's Profile Acceleration 200 = 74.9 rad/s^2"}
  usage_ratio:     {value: 0.9, source: user_decision,
                    ref: "2026-11-24 user: use up to 90 % of the manual maximum (speed and acceleration)"}

targets:
  real:
    model:
      left_radius:  {value: 0.027,  source: official_default, ref: "pinky_bringup bringup.py wheel_radius"}
      right_radius: {value: 0.027,  source: official_default, ref: "pinky_bringup bringup.py wheel_radius"}
      track:        {value: 0.0961, source: official_default, ref: "pinky_bringup bringup.py wheel_separation"}
      tau_left:     {value: 0.05,   source: assumption, ref: "not identified; first-order wheel response"}
      tau_right:    {value: 0.05,   source: assumption, ref: "not identified; first-order wheel response"}
      delay:        {value: 0.0,    source: assumption, ref: "not identified; command-to-motion dead time"}
      wheel_speed_max: {value: 10.47, source: official_default, ref: "bringup.py MAX_RPM 100 -> 10.47 rad/s"}
      wheel_accel_max: {value: 74.9,  source: official_default, ref: "dynamixel_driver Profile Acceleration 200 x 214.577 rpm/min"}
    driver:
      wheel_radius:     {value: 0.027,  source: official_default, ref: "bringup.py; overridden by launch wheel_radius"}
      wheel_separation: {value: 0.0961, source: official_default, ref: "bringup.py; overridden by launch wheel_separation"}
      max_rpm:          {value: 100.0,  source: official_default, ref: "bringup.py twist_callback MAX_RPM (ratio-preserving scale)"}
      rpm_resolution:   {value: 0.229,  source: official_default, ref: "dynamixel_driver RPM_TO_VALUE_SCALE (int truncation)"}
    # /joint_states sign per wheel relative to "positive = this wheel drives the robot forward".
    # The official driver publishes the raw right motor velocity/position (mirrored motor), and
    # pinky_soccer_bringup's relay only renames joints. Expected -1 for the right wheel from the
    # code; VERIFY on the robot with check_wheel_signs before trusting it.
    joint_sign:
      left:  {value: 1,  source: assumption, ref: "code analysis, not verified on hardware"}
      right: {value: -1, source: assumption, ref: "code analysis, not verified on hardware"}

  mujoco:
    model:
      left_radius:  {value: 0.028,  source: simulation_model, ref: "pinky_mujoco Physics radius (l_wheel_collision_0)"}
      right_radius: {value: 0.028,  source: simulation_model, ref: "pinky_mujoco Physics radius"}
      track:        {value: 0.0971, source: simulation_model, ref: "pinky_mujoco Physics track (wheel collision centres)"}
      tau_left:     {value: 0.05,   source: assumption, ref: "identify with identify_sim (velocity actuator + 74.9 rad/s^2 ramp)"}
      tau_right:    {value: 0.05,   source: assumption, ref: "identify with identify_sim"}
      delay:        {value: 0.0,    source: assumption, ref: "bridge period 10 ms"}
      wheel_speed_max: {value: 10.47, source: simulation_model, ref: "pinky_soccer_sim emulates the real driver: 100 rpm ratio-preserving scaling (motor max_speed 103 RPM no-load)"}
      wheel_accel_max: {value: 74.9, source: simulation_model, ref: "mujoco.yaml motors.wheel_accel"}
    driver:
      wheel_radius:     {value: 0.028,  source: simulation_model, ref: "Physics.step uses the model radius"}
      wheel_separation: {value: 0.0971, source: simulation_model, ref: "Physics.step uses the model track"}
      max_rpm:          {value: 100.0,  source: simulation_model, ref: "pinky_soccer_sim real_driver_limits (same scaling as bringup.py); the bridge's own 0.25 m/s / 1.5 rad/s clamps are lifted"}
    joint_sign:
      left:  {value: 1, source: simulation_model, ref: "URDF axis 0 1 0, qvel"}
      right: {value: 1, source: simulation_model, ref: "URDF axis 0 1 0, qvel"}

  gazebo:
    model:
      left_radius:  {value: 0.028,  source: simulation_model, ref: "pinky_gz.urdf.xacro DiffDrive wheel_radius"}
      right_radius: {value: 0.028,  source: simulation_model, ref: "pinky_gz.urdf.xacro"}
      track:        {value: 0.0961, source: simulation_model, ref: "pinky_gz.urdf.xacro DiffDrive wheel_separation"}
      tau_left:     {value: 0.05,   source: assumption, ref: "not identified"}
      tau_right:    {value: 0.05,   source: assumption, ref: "not identified"}
      delay:        {value: 0.0,    source: assumption, ref: "not identified"}
      wheel_speed_max: {value: 10.4719755, source: official_default, ref: "100 RPM real driver limit; gazebo motor adapter"}
      wheel_accel_max: {value: 71.4, source: simulation_model, ref: "DiffDrive max_acceleration 2.0 m/s^2 / 0.028"}
    driver:
      wheel_radius:     {value: 0.028,  source: simulation_model, ref: "DiffDrive plugin"}
      wheel_separation: {value: 0.0961, source: simulation_model, ref: "DiffDrive plugin"}
      max_rpm:          {value: 100.0, source: official_default, ref: "real driver; gazebo motor adapter"}
    joint_sign:
      left:  {value: 1, source: simulation_model, ref: "URDF axis 0 1 0"}
      right: {value: 1, source: simulation_model, ref: "URDF axis 0 1 0"}
