# Sensor geometry/scenario assumptions. Measured errors: measured_sensor_noise.yaml.
# Poses come from the official URDF, including its unverified IR directions (+X).
camera:
  width: 640
  height: 480
  fps: 15.0
  horizontal_fov: 1.1519  # official model assumption; replace after physical calibration
  jpeg_quality: 85
ultrasonic:
  min_range: 0.02
  max_range: 3.0
  field_of_view: 0.26
  samples: 5
ir:
  min_range: 0.005
  max_range: 0.8  # simulation search bound, not a measured device specification
  # Increasing distances (m), matching ADC values (0..4095). Fill with measurements.
  # No invented ADC transfer curve: ir_sensor/range is disabled until provided.
  distances: []
  adc_values: []
battery:
  voltage: 8.4  # ideal charged 2S simulation scenario, not a hardware measurement
  percent: 100.0
